<div class="shopping-cart">
  <h2>Cart</h2>

  @if (items().length === 0) {
    <p>Your cart is empty.</p>
  } @else {
    @for (item of items(); track item.productId) {
      <div class="cart-item">
        <strong>{{ item.name }}</strong>
        <span>{{ item.quantity }} x {{ item.price }}</span>
      </div>
    }
  }
</div>
